[package]
name = "woodshed"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "A music player for transcription and rehearsal: zoomable waveform/spectrogram, pitch readout, loops and bookmarks"

# A standalone project: it has a large GUI dependency tree, so it stays out of
# the fmpiano workspace (and its Cargo.lock) at the repository root.
[workspace]

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["glow", "x11", "wayland", "default_fonts", "clipboard"] }
cpal = "0.18"
symphonia = { version = "0.6", features = ["all"] }
egui_extras = { version = "0.37", default-features = false }
midly = { version = "0.5", default-features = false, features = ["std", "alloc"] }
rustysynth = "1.3"
rfd = "0.18"
realfft = "3.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
lto = "thin"
